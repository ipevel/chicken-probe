<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：让 CSS 的 env(safe-area-inset-*) 在刘海屏生效。
     不再写 maximum-scale=1,user-scalable=no：那会禁掉缩放，违反 WCAG 1.4.4，
     而面板上还有 11px 的标签和 13px 的输入框——低视力用户唯一的补救手段就是放大。
     鸡场里捏合会连画布一起缩放，那是鸡场自己的事，用 touch-action 在画布上拦，
     不要拿整页的可缩放性去换。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9fd08a">
<meta name="mobile-web-app-capable" content="yes">
<title>养鸡探针</title>
<!-- favicon：路径画的实心鸡头 + 浅绿圆角图块。
     原来这里是 <text> 里塞一个鸡头 emoji（U+1F414）：看着是 SVG，实际渲染仍然依赖系统
     emoji 字体 —— 没有 emoji 字形的环境（精简 Linux、部分 Windows 字体配置）只显示豆腐块。
     路径与 sprite 里的 #i-logo 是同一份几何（translate(2 2) scale(1.16667) 把 24 网格放到 32 网格），
     改 i-logo 的 d 时必须一起改。
     颜色写 rgb() 不写 #：data: URI 里的 # 会被当成片段标识符截断。 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='rgb(159,208,138)'/><g transform='translate(2 2) scale(1.16667)' fill='rgb(30,58,22)'><path fill-rule='evenodd' d='M6.4 12.6a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M14.6 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0'/><path d='M7.7 7.2a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0'/><path d='M10.2 6.1a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0'/><path d='M13.5 7.1a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0'/><path d='M17.4 11.2L22.4 13.1L17.4 15z'/><path d='M15.3 17.6a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0 -3.4 0'/></g></svg>">
<link rel="stylesheet" href="/style.css">
<script>
  // 亮暗在首屏前定好：放在 effect 里会让暗色访客每次加载闪一下白
  (() => {
    const key = 'chicken-probe:theme';
    const saved = localStorage.getItem(key);
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<!-- 这里刻意不预载 three：面板是主界面，而 three 只在进鸡场时才被
     farm.js 用 await import() 按需拉取。modulepreload 会把 ~2MB（gzip ~397KB）
     连带依赖一起抓下来，让不进鸡场的人也付这份流量与解析成本。 -->
</head>
<body>
<!-- 图标 sprite：内联在同一份文档里，<use href="#id"> 才拿得到 currentColor ——
     跨文档引用时 color 不会继承进被引用文档的 shadow tree，结果是「面板里图标是绿的、
     鸡场里图标是黑的」。内联也不新增请求，静态包离线可用。
     用 position:absolute + width/height 0 + overflow:hidden 隐藏，**不要用 display:none** ——
     与 flag.js 挂国旗 sprite 的方式保持一致。

     ⚠ 表现属性（fill / stroke / stroke-width / linecap / linejoin）必须写在每个 symbol
     元素自己身上。它们写在根 svg 上、或者包一层 g，都不管用：
     use 的 shadow tree 继承链是「use 元素 + 文档祖先」，不是 symbol 的祖先。
     写错的表现是 21 个描边符号全部渲染成实心黑块，而且不会有任何报错。
     这段注释里不要出现 symbol / svg 的尖括号写法：HTML 注释里它们是合法文本，
     但任何「扫 symbol 标签」的脚本（比如 .shots/compare-sprite.mjs）会从注释里那个
     假标签开始配对，把紧跟其后的真符号整段吞掉。

     ⚠ 这份 sprite 里绝不能出现 index.html 中被构建脚本做版本号替换的那三个 URL 字面量
     （样式表、主脚本、以及 importmap 里的 three 入口）。tools/build-theme.mjs 靠
     String.replace 精确替换往它们身上注版本号，而传字符串时只替换第一处 ——
     多插一份就会把版本号注到错的位置、真引用拿到未加版本号的 URL，
     浏览器缓存不刷新，构建却不会报错。所以别往 sprite 里加带 URL 的元素。 -->
<svg id="icon-sprite" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden">
<defs>

<!-- 品牌鸡头（实心）。鸡冠三团 + 头 + 喙 + 肉垂；眼睛是 evenodd 挖出来的洞，
     所以放在同一个 path 里，不能拆开。 -->
<symbol id="i-logo" viewBox="0 0 24 24" data-mode="fill">
  <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M6.4 12.6a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M14.6 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>
  <path fill="currentColor" stroke="none" d="M7.7 7.2a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0"/>
  <path fill="currentColor" stroke="none" d="M10.2 6.1a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0"/>
  <path fill="currentColor" stroke="none" d="M13.5 7.1a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0"/>
  <path fill="currentColor" stroke="none" d="M17.4 11.2L22.4 13.1L17.4 15z"/>
  <path fill="currentColor" stroke="none" d="M15.3 17.6a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0 -3.4 0"/>
</symbol>

<!-- 整只鸡（描边）。身体 + 头 + 喙 + 肉垂 + 冠 + 脚。
     腿在 1.75 描边下只有一线宽，只适合 ≥18px；小尺寸请用 i-logo。 -->
<symbol id="i-chicken" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.4 13.8a6.4 5.2 0 1 0 12.8 0a6.4 5.2 0 1 0 -12.8 0"/>
  <path d="M12.1 7.6a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0"/>
  <path d="M13.9 4.8c.1-1.1.8-1.9 1.8-2"/>
  <path d="M16.3 4.3c.3-1.1 1.1-1.8 2.2-1.7"/>
  <path d="M18.4 6.7L22.5 8.3L18.4 9.9z"/>
  <path d="M18 10c.1 1.1.8 1.8 1.7 2"/>
  <path fill="currentColor" stroke="none" d="M15 6.9a.68 .68 0 1 0 1.36 0a.68 .68 0 1 0 -1.36 0"/>
  <path d="M9.2 18.6v1.9M9.2 20.5H7.9M9.2 20.5h1.3"/>
  <path d="M12.4 18.6v1.9M12.4 20.5h-1.3M12.4 20.5h1.3"/>
</symbol>

<!-- 网站鸡：球体 + 赤道 + 两条 14 半径的子午线（半径比球大才贴在球里，同半径会跟球边重合） -->
<symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
  <path d="M3 12h18"/>
  <path d="M12 3a14 14 0 0 0 0 18"/>
  <path d="M12 3a14 14 0 0 1 0 18"/>
</symbol>

<!-- 访客：头 + 肩 -->
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8.5 8.2a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0"/>
  <path d="M4.6 20.6a7.4 7.4 0 0 1 14.8 0"/>
</symbol>

<!-- 管理后台：六齿齿轮外轮廓（角用二次曲线倒过，1.75 描边下齿不会糊）+ 轴心 -->
<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.33 5.33Q9.87 5.02 9.94 4.4L10.16 2.57Q10.23 1.95 10.85 1.95L13.15 1.95Q13.77 1.95 13.84 2.57L14.06 4.4Q14.13 5.02 14.67 5.33L16.44 6.35Q16.98 6.66 17.55 6.42L19.24 5.69Q19.81 5.44 20.12 5.98L21.27 7.97Q21.58 8.51 21.09 8.88L19.61 9.99Q19.11 10.36 19.11 10.98L19.11 13.02Q19.11 13.64 19.61 14.01L21.09 15.12Q21.58 15.49 21.27 16.03L20.12 18.02Q19.81 18.56 19.24 18.31L17.55 17.58Q16.98 17.34 16.44 17.65L14.67 18.67Q14.13 18.98 14.06 19.6L13.84 21.43Q13.77 22.05 13.15 22.05L10.85 22.05Q10.23 22.05 10.16 21.43L9.94 19.6Q9.87 18.98 9.33 18.67L7.56 17.65Q7.02 17.34 6.45 17.58L4.76 18.31Q4.19 18.56 3.88 18.02L2.73 16.03Q2.42 15.49 2.91 15.12L4.39 14.01Q4.89 13.64 4.89 13.02L4.89 10.98Q4.89 10.36 4.39 9.99L2.91 8.88Q2.42 8.51 2.73 7.97L3.88 5.98Q4.19 5.44 4.76 5.69L6.45 6.42Q7.02 6.66 7.56 6.35z"/>
  <path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
</symbol>

<!-- 亮/暗切换：整圆描边 + 左半填充。方向是刻意的：
     原来的字符是 ◐（U+25D0，左半黑），不是 ◑（U+25D1）。
     上半段弧的 sweep 取 0 才填左半，取 1 会变成右半 —— 已渲染核对过。 -->
<symbol id="i-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
  <path fill="currentColor" stroke="none" d="M12 3a9 9 0 0 0 0 18z"/>
</symbol>

<!-- 网格视图 -->
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.1 3.4h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>

  <path d="M5.1 13.6h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
  <path d="M15.3 13.6h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
</symbol>

<!-- 列表视图：h.01 配圆头线帽就是圆点，不需要额外的实心圆 -->
<symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

<!-- 改名 -->
<symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

</symbol>

<!-- 重新读取历史（原来是 ⟳）。四分之三圆 + 折线箭头：用 8.2 半径精确算过端点。 -->
<symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

  <path d="M17.6 7.1a7 7 0 0 1 0 9.8"/>

</symbol>

<!-- 撞击爆点（原来是 U+1F4A5，爆炸 emoji）。实心：描边的八角星读起来是星星，不是「打中了」。 -->

<!-- 触屏「跳」：向上箭头 + 地面线，与 i-peck 严格镜像（同一段箭杆 5.1→13.3、同一条地面线 y=17.7）。
     三个候选都渲染比对过：
       · 向上箭头（无地面线）—— 和 i-up（上行流量）在 16~24px 下几乎一样；
       · 半圆拱 + 悬空底线 / 抛物线 + 地面线 —— 都读成「隧道 / 桥」，不是「跳」。

<div id="boot"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg>鸡场加载中…</div>

<!-- ============ 监控面板：主题的主界面 ============ -->
<main id="panel" class="panel">
  <header class="top">
    <h1 id="site-name"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg><span id="site-name-text">养鸡探针</span></h1>
    <span id="conn" class="conn" title="数据连接状态">连接中</span>
    <div class="top-actions">
      <button id="farm-btn" class="ghost" type="button" title="走进 3D 鸡场，节点即鸡"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg>进鸡场</button>
      <!-- 用 <a target="_blank"> 而不是 button + window.open：中键/⌘点击、
           右键「在新标签页打开」这些浏览器原生行为只有真链接才有，
           而且 target="_blank" 会自动带上 rel="noopener" 的同源隔离效果。 -->
      <a id="admin-btn" class="ghost" href="/admin" target="_blank" rel="noopener noreferrer"
         title="打开探针主控的管理后台（新标签页）"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-gear"/></svg>管理</a>
      <!-- 图标是按钮唯一内容：图形 aria-hidden，名称给按钮（读屏念的是 aria-label 而不是字符名）
           title 管鼠标悬浮，aria-label 管读屏，两个都要留。 -->
      <button id="theme-btn" class="ghost icon" type="button" title="亮/暗切换" aria-label="切换亮色/暗色主题"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-theme"/></svg></button>
    </div>
  </header>

  <section id="summary" class="summary" aria-label="总览"></section>

  <section class="controls">
    <div id="chips" class="chips" role="tablist" aria-label="状态筛选"></div>
    <select id="country" aria-label="地区筛选"><option value="">全部地区</option></select>
    <select id="sort" aria-label="排序"></select>
    <input id="q" type="search" placeholder="搜索名称或地区" aria-label="搜索">
    <div class="viewtoggle">
      <button data-view="grid" type="button" title="网格" aria-label="网格视图"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-grid"/></svg></button>
      <button data-view="list" type="button" title="列表" aria-label="列表视图"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-list"/></svg></button>
    </div>
  </section>

  <section id="grid" class="grid" aria-live="polite"></section>
  <p id="empty" class="empty hidden">没有符合条件的机器</p>
</main>

<!-- ============ 鸡场：3D 视图，节点鸡就是被监控的机器 ============ -->
<div id="farm" class="farm hidden">
  <div id="app"></div>

  <!-- HUD：整层不吃指针，只有 #hud-top 里的按钮/#board/#me 自己开 pointer-events -->
  <div id="hud">
    <div id="hud-top">
      <div class="hud-stats">
        <span><svg class="i i-16" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg>探针鸡 在线 <b id="online">0</b></span>
        <span><svg class="i i-16" aria-hidden="true" focusable="false"><use href="#i-globe"/></svg>网站鸡 在线 <b id="web-online">0</b></span>
        <span><svg class="i i-16" aria-hidden="true" focusable="false"><use href="#i-user"/></svg>访客 <b id="visitors">0</b></span>
      </div>
      <button id="back-btn" type="button"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-back"/></svg>回面板</button>
      <span id="room-state" class="conn" title="联机状态">单机</span>
    </div>

    <div id="board">
      <!-- 标题里的文字单独一层 span：farm.js 折叠/展开时整体覆盖标题文字，
           直接写 #board-title 的 textContent 会把图标一起删掉（而且不报错）。 -->
      <h3 id="board-title"><svg class="i i-16" aria-hidden="true" focusable="false"><use href="#i-logo"/></svg><span id="board-title-text">啄倒榜</span></h3>
      <div id="board-rows"></div>
    </div>

    <div id="feed"></div>

    <div id="me">
      <div id="me-line">
        <span id="me-name"></span>
        <button id="me-edit" type="button" title="改名字" aria-label="改名字"><svg class="i i-20" aria-hidden="true" focusable="false"><use href="#i-pencil"/></svg></button>
      </div>
      <div id="me-name-editor" class="hidden">
        <div id="me-name-row">
          <input id="me-name-input" maxlength="24" placeholder="名字（≤8个汉字）">
          <button id="me-name-ok" type="button">确定</button>
        </div>
      </div>
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="score">分数 0</div>
    </div>

    <div id="hint-desktop" class="hint">WASD 移动 · Shift 疾跑 · 空格 跳 · 拖动鼠标转视角（点一下可锁定）· 左键/E 啄 · 右键/F 扇翅 · 滚轮 缩放 · M 静音</div>
    <div id="hint-touch" class="hint">左摇杆移动（推到底疾跑）· 拖屏幕转视角 · 轻点啄 · 右侧按钮啄/疾跑/跳</div>
  </div>

  <!-- 触屏件：容器不吃手势，控件自己吃（空白处拖动仍是转视角） -->
  <div id="touch-ui">
    <div class="tc-stick">
      <div class="tc-stick-ring"></div>
      <div class="tc-stick-knob"></div>
    </div>
    <div class="tc-actions">
      <button class="tc-btn tc-btn-peck" type="button" title="啄" aria-label="啄"><svg class="i i-26" aria-hidden="true" focusable="false"><use href="#i-peck"/></svg>啄</button>
      <button class="tc-btn tc-btn-run" type="button" title="疾跑（可切换）" aria-label="疾跑"><svg class="i i-26" aria-hidden="true" focusable="false"><use href="#i-run"/></svg>跑</button>
      <button class="tc-btn tc-btn-jump" type="button" title="跳" aria-label="跳"><svg class="i i-26" aria-hidden="true" focusable="false"><use href="#i-jump"/></svg>跳</button>
    </div>
  </div>

  <!-- 倒地横幅：靠 .show 淡入淡出，不是 .hidden -->
  <div id="ko-banner"></div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
