<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
<!--
  养鸡探针 · 权威图标 sprite
  ==========================================================================
  约定（改之前先读完，这几条是给 canvas 侧和打包侧留的接口）：

  1. 所有符号 viewBox="0 0 24 24"，24 号网格。描边统一 1.75、圆头圆角、
     stroke="currentColor"、fill="none"，颜色一律由使用处的 color 决定。
     图标内不出现任何颜色字面量，这样亮暗两套、面板与鸡场两套配色
     都能直接复用同一份图形。

  2. **只用 <path>，不用 <circle> / <rect> / <ellipse> / <line>。**
     圆形写成两段 a 弧。原因不是风格洁癖：3D 名牌画在 canvas 上，
     canvas 要复刻同一个图形就得拿 d 字符串喂 Path2D；能用
     querySelectorAll('symbol#i-x path') 逐个取 d 拼出一条 Path2D，
     就不用依赖 SVGGeometryElement.getPathData()（兼容性至今不齐）。
     代价是 d 更长，收益是「同一份图形，DOM 和 canvas 都能画」。

  3. 实心样式只给两处品牌/语义图形，用 data-mode="fill" 标记：
        i-logo —— 品牌鸡头（凹版眼睛用 fill-rule="evenodd" 挖空，不填背景色）
        i-hit  —— 撞击爆点（轮廓化的爆点会变成星星，读不出「打中了」）
     其余符号一律描边。canvas 侧按这个属性决定 stroke 还是 fill。

  4. 尺寸建议：≤16px 用实心 i-logo（小尺寸下实心轮廓比描边清楚），
     ≥18px 才用描边的 i-chicken。HUD 那三行图标按此规则取 i-logo/i-globe/i-user。

  5. 这份 sprite 进 theme/index.html 时是**内联**的（静态主题、离线可用、
     currentColor 与 CSS 变量要能穿透），不引外部文件。见
     docs/visual-refresh-20260929.md 第 ① 章「sprite 接入方式」。
-->
<defs>

<!-- 品牌鸡头（实心）。鸡冠三团 + 头 + 喙 + 肉垂；眼睛是 evenodd 挖出来的洞，
     所以放在同一个 path 里，不能拆开。 -->
<symbol id="i-logo" viewBox="0 0 24 24" data-mode="fill">
  <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M6.4 12.6a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M14.6 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>
  <path fill="currentColor" stroke="none" d="M7.7 7.2a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0"/>
  <path fill="currentColor" stroke="none" d="M10.2 6.1a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0"/>
  <path fill="currentColor" stroke="none" d="M13.5 7.1a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0"/>
  <path fill="currentColor" stroke="none" d="M17.4 11.2L22.4 13.1L17.4 15z"/>
  <path fill="currentColor" stroke="none" d="M15.3 17.6a1.7 1.7 0 1 0 3.4 0a1.7 1.7 0 1 0 -3.4 0"/>
</symbol>

<!-- 整只鸡（描边）。身体 + 头 + 喙 + 肉垂 + 冠 + 脚。
     腿在 1.75 描边下只有一线宽，只适合 ≥18px；小尺寸请用 i-logo。 -->
<symbol id="i-chicken" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.4 13.8a6.4 5.2 0 1 0 12.8 0a6.4 5.2 0 1 0 -12.8 0"/>
  <path d="M12.1 7.6a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0"/>
  <path d="M13.9 4.8c.1-1.1.8-1.9 1.8-2"/>
  <path d="M16.3 4.3c.3-1.1 1.1-1.8 2.2-1.7"/>
  <path d="M18.4 6.7L22.5 8.3L18.4 9.9z"/>
  <path d="M18 10c.1 1.1.8 1.8 1.7 2"/>
  <path fill="currentColor" stroke="none" d="M15 6.9a.68 .68 0 1 0 1.36 0a.68 .68 0 1 0 -1.36 0"/>
  <path d="M9.2 18.6v1.9M9.2 20.5H7.9M9.2 20.5h1.3"/>
  <path d="M12.4 18.6v1.9M12.4 20.5h-1.3M12.4 20.5h1.3"/>
</symbol>

<!-- 网站鸡：球体 + 赤道 + 两条 14 半径的子午线（半径比球大才贴在球里，同半径会跟球边重合） -->
<symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
  <path d="M3 12h18"/>
  <path d="M12 3a14 14 0 0 0 0 18"/>
  <path d="M12 3a14 14 0 0 1 0 18"/>
</symbol>

<!-- 访客：头 + 肩 -->
<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8.5 8.2a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0"/>
  <path d="M4.6 20.6a7.4 7.4 0 0 1 14.8 0"/>
</symbol>

<!-- 管理后台：六齿齿轮外轮廓（角用二次曲线倒过，1.75 描边下齿不会糊）+ 轴心 -->
<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.33 5.33Q9.87 5.02 9.94 4.4L10.16 2.57Q10.23 1.95 10.85 1.95L13.15 1.95Q13.77 1.95 13.84 2.57L14.06 4.4Q14.13 5.02 14.67 5.33L16.44 6.35Q16.98 6.66 17.55 6.42L19.24 5.69Q19.81 5.44 20.12 5.98L21.27 7.97Q21.58 8.51 21.09 8.88L19.61 9.99Q19.11 10.36 19.11 10.98L19.11 13.02Q19.11 13.64 19.61 14.01L21.09 15.12Q21.58 15.49 21.27 16.03L20.12 18.02Q19.81 18.56 19.24 18.31L17.55 17.58Q16.98 17.34 16.44 17.65L14.67 18.67Q14.13 18.98 14.06 19.6L13.84 21.43Q13.77 22.05 13.15 22.05L10.85 22.05Q10.23 22.05 10.16 21.43L9.94 19.6Q9.87 18.98 9.33 18.67L7.56 17.65Q7.02 17.34 6.45 17.58L4.76 18.31Q4.19 18.56 3.88 18.02L2.73 16.03Q2.42 15.49 2.91 15.12L4.39 14.01Q4.89 13.64 4.89 13.02L4.89 10.98Q4.89 10.36 4.39 9.99L2.91 8.88Q2.42 8.51 2.73 7.97L3.88 5.98Q4.19 5.44 4.76 5.69L6.45 6.42Q7.02 6.66 7.56 6.35z"/>
  <path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
</symbol>

<!-- 亮/暗切换：整圆描边 + 左半填充。方向是刻意的：
     原来的字符是 ◐（U+25D0，左半黑），不是 ◑（U+25D1）。
     上半段弧的 sweep 取 0 才填左半，取 1 会变成右半 —— 已渲染核对过。 -->
<symbol id="i-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
  <path fill="currentColor" stroke="none" d="M12 3a9 9 0 0 0 0 18z"/>
</symbol>

<!-- 网格视图 -->
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.1 3.4h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
  <path d="M15.3 3.4h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
  <path d="M5.1 13.6h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
  <path d="M15.3 13.6h3.6a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1 -1.7 1.7h-3.6a1.7 1.7 0 0 1 -1.7 -1.7v-3.6a1.7 1.7 0 0 1 1.7 -1.7z"/>
</symbol>

<!-- 列表视图：h.01 配圆头线帽就是圆点，不需要额外的实心圆 -->
<symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9.2 6.6h10.9M9.2 12h10.9M9.2 17.4h10.9"/>
  <path d="M4.6 6.6h.01M4.6 12h.01M4.6 17.4h.01"/>
</symbol>

<!-- 回面板 -->
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M19.5 12H4.8"/>
  <path d="M11 18.5L4.5 12L11 5.5"/>
</symbol>

<!-- 改名 -->
<symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4.6 19.4l.9-4.1L15.2 5.6a2.05 2.05 0 0 1 2.9 2.9L8.4 18.2z"/>
  <path d="M13.5 7.3l3.2 3.2"/>
</symbol>

<!-- 关闭 -->
<symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/>
</symbol>

<!-- 重新读取历史（原来是 ⟳）。四分之三圆 + 折线箭头：用 8.2 半径精确算过端点。 -->
<symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M19.1 7.9A8.2 8.2 0 1 1 12 3.8"/>
  <path d="M9 1.6L12 3.8L9 6"/>
</symbol>

<!-- 声音开 -->
<symbol id="i-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11.4 5.4L7.2 8.8H4.2v6.4h3l4.2 3.4z"/>
  <path d="M15 9.4a3.7 3.7 0 0 1 0 5.2"/>
  <path d="M17.6 7.1a7 7 0 0 1 0 9.8"/>
</symbol>

<!-- 声音关：喇叭 + 叉，与声音开共用同一只喇叭，切换时不跳形 -->
<symbol id="i-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11.4 5.4L7.2 8.8H4.2v6.4h3l4.2 3.4z"/>
  <path d="M15.2 9.8l4.6 4.6M19.8 9.8l-4.6 4.6"/>
</symbol>

<!-- 被啄晕（原来是 😵）：整圆 + 两个叉眼 + 波浪嘴 -->
<symbol id="i-dizzy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
  <path d="M8.1 8.6l2.5 2.5M10.6 8.6l-2.5 2.5"/>
  <path d="M13.4 8.6l2.5 2.5M15.9 8.6l-2.5 2.5"/>
  <path d="M8.3 16.1c1.2-1.4 2.5-1.4 3.7 0s2.5 1.4 3.7 0"/>
</symbol>

<!-- 啄倒数（原来是 🏆） -->
<symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 4.2h10v4.3a5 5 0 0 1 -10 0z"/>
  <path d="M7 5.6H5.4a2 2 0 0 0 0 4H7"/>
  <path d="M17 5.6h1.6a2 2 0 0 1 0 4H17"/>
  <path d="M12 13.5v3.2"/>
  <path d="M9.3 16.7h5.4l.9 3.9H8.4z"/>
</symbol>

<!-- 断线重连（原来是 🔗）：两节链环 -->
<symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l2.6-2.6a3.6 3.6 0 0 0 -5.1 -5.1l-1.3 1.3"/>
  <path d="M13.8 10.2a3.6 3.6 0 0 0 -5.1 0l-2.6 2.6a3.6 3.6 0 0 0 5.1 5.1l1.3-1.3"/>
</symbol>

<!-- 撞击爆点（原来是 💥）。实心：描边的八角星读起来是星星，不是「打中了」。 -->
<symbol id="i-hit" viewBox="0 0 24 24" data-mode="fill">
  <path fill="currentColor" stroke="none" d="M12 1.6L13.8 7.66L19.35 4.65L16.34 10.2L22.4 12L16.34 13.8L19.35 19.35L13.8 16.34L12 22.4L10.2 16.34L4.65 19.35L7.66 13.8L1.6 12L7.66 10.2L4.65 4.65L10.2 7.66z"/>
</symbol>

<!-- 触屏「啄」：向下啄 + 地面线 -->
<symbol id="i-peck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 5.1v8.2"/>
  <path d="M8.4 9.7L12 13.3L15.6 9.7"/>
  <path d="M4.8 17.7h14.4"/>
</symbol>

<!-- 触屏「跑/疾跑」：双右尖角，方向明确 -->
<symbol id="i-run" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.6 5.9L11.7 12l-6.1 6.1"/>
  <path d="M12.9 5.9L19 12l-6.1 6.1"/>
</symbol>

<!-- 触屏「跳」：向上箭头 + 地面线，与 i-peck 严格镜像（同一段箭杆 5.1→13.3、同一条地面线 y=17.7）。
     三个候选都渲染比对过：
       · 向上箭头（无地面线）—— 和 i-up（上行流量）在 16~24px 下几乎一样；
       · 半圆拱 + 悬空底线 / 抛物线 + 地面线 —— 都读成「隧道 / 桥」，不是「跳」。
     现在这一对是「啄 = 向下啄到地」「跳 = 向上离开地」的镜像，
     两个语义本身就是一对反动作，形状成对才说得通；中间的 i-run 又隔开了它们。
     按钮上同时有「跳」字，图形是补充说明，不是唯一信息源。 -->
<symbol id="i-jump" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 13.3V5.1"/>
  <path d="M8.4 8.7L12 5.1l3.6 3.6"/>
  <path d="M4.8 17.7h14.4"/>
</symbol>

<!-- 上行流量。文字里的 ↑/↓ 只要在句子中间就不必换（不是 emoji，
     字体覆盖 100%），但作为独立读数前缀时用它保持图形一致。 -->
<symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 19.4V5"/>
  <path d="M6.6 10.4L12 5l5.4 5.4"/>
</symbol>

<!-- 下行流量 -->
<symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 4.6V19"/>
  <path d="M6.6 13.6L12 19l5.4-5.4"/>
</symbol>

</defs>
</svg>
